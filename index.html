<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ゴビョー！</title>
  <meta name="description" content="上にスワイプすると次々出てくる、5秒ミニゲームのショート。連続クリアでコンボをのばそう。">
  <meta name="theme-color" content="#ffd23f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ゴビョー！">
  <meta property="og:description" content="上にスワイプすると次々出てくる、5秒ミニゲームのショート。きみは何連続クリアできる？">
  <meta name="twitter:card" content="summary">
  <!--
    公開URLが決まったら、下の3行の「https://公開URL/」を自分のURLに書きかえて、
    その3行をはさんでいるコメント記号の行（前後の2行）を消してください。
    また、上の twitter:card の summary を summary_large_image に変えます。
    （SNSでURLを貼ったときに、大きな画像つきで表示されるようになります）
  -->
  <!--
  <meta property="og:url" content="https://公開URL/">
  <meta property="og:image" content="https://公開URL/ogp.png">
  <meta name="twitter:image" content="https://公開URL/ogp.png">
  -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Mochiy+Pop+One&family=Rampart+One&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hud">
    <p class="hud-logo">ゴビョー!</p>
    <div class="hud-stats">
      <p id="hudComboChip" class="hud-chip hud-combo"><small>COMBO</small><b id="hudCombo">0</b></p>
      <p class="hud-chip"><small>BEST</small><b id="hudBest">0</b></p>
    </div>
  </header>

  <main id="feed" class="feed">
    <section id="slotTitle" class="slot slot-title" aria-label="タイトル">
      <span class="deco deco-ring" aria-hidden="true"></span>
      <span class="deco deco-tri" aria-hidden="true"></span>
      <span class="deco deco-dots" aria-hidden="true"></span>

      <div class="title-card">
        <h1 class="logo">ゴビョー!</h1>
        <p class="tagline">5秒ミニゲーム・ショート</p>

        <ol class="howto">
          <li>上にスワイプすると、次のゲームが始まる</li>
          <li>お題を5秒以内にクリアしよう</li>
          <li>連続クリアでCOMBOがのびて、だんだん難しくなる</li>
        </ol>

        <p class="title-best">きみのベスト　<b id="titleBest">0</b> COMBO</p>
        <button id="btnStart" class="swipe-hint" type="button">↑ 上にスワイプでスタート</button>
        <a class="title-link" href="privacy.html">プライバシーポリシー</a>
      </div>
    </section>
  </main>

  <p id="toast" class="toast" role="status" hidden></p>

  <script src="js/config.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
