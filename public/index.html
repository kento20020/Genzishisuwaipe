<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ゴビョー！</title>
  <meta name="description" content="上にスワイプすると次々出てくる、5秒ミニゲームのショート。連続クリアでコンボをのばそう。">
  <meta name="theme-color" content="#ffd23f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ゴビョー！">
  <meta property="og:description" content="上にスワイプすると次々出てくる、5秒ミニゲームのショート。きみは何連続クリアできる？">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:url" content="https://gobyo.kento-dev.workers.dev/">
  <meta property="og:image" content="https://gobyo.kento-dev.workers.dev/ogp.png">
  <meta name="twitter:image" content="https://gobyo.kento-dev.workers.dev/ogp.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Mochiy+Pop+One&family=Rampart+One&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games-b1.css">
  <link rel="stylesheet" href="css/games-b2.css">
  <link rel="stylesheet" href="css/games-b3.css">
</head>
<body>
  <header class="hud">
    <p class="hud-logo">ゴビョー!</p>
    <div class="hud-stats">
      <p id="hudComboChip" class="hud-chip hud-combo"><small>COMBO</small><b id="hudCombo">0</b></p>
      <p class="hud-chip"><small>BEST</small><b id="hudBest">0</b></p>
    </div>
  </header>

  <main id="feed" class="feed">
    <section id="slotTitle" class="slot slot-title" aria-label="タイトル">
      <span class="deco deco-ring" aria-hidden="true"></span>
      <span class="deco deco-tri" aria-hidden="true"></span>
      <span class="deco deco-dots" aria-hidden="true"></span>

      <div class="title-card">
        <h1 class="logo">ゴビョー!</h1>
        <p class="tagline">5秒ミニゲーム・ショート</p>

        <ol class="howto">
          <li>上にスワイプすると、次のゲームが始まる</li>
          <li>お題を見て、5秒以内にクリアしよう</li>
          <li>連続クリアでCOMBOがのびて、だんだん難しくなる</li>
        </ol>

        <p class="title-best">きみのベスト　<b id="titleBest">0</b> COMBO</p>
        <button id="btnStart" class="title-start" type="button"><span id="titleCue" class="title-cue"></span><span class="swipe-hint">上にスワイプでスタート</span></button>
        <p class="title-links"><a class="title-link" href="privacy">プライバシーポリシー</a><a class="title-link" href="tokushoho">特定商取引法に基づく表記</a></p>
      </div>
    </section>
  </main>

  <p id="toast" class="toast" role="status" hidden></p>

  <script src="js/config.js"></script>
  <script src="js/games.js"></script>
  <script src="js/games-b1.js"></script>
  <script src="js/games-b2.js"></script>
  <script src="js/games-b3.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
